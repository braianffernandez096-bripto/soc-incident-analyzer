name: Reportar un error
description: Algo no funciona como se espera
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        No subas datos reales ni claves. Si es una vulnerabilidad, **no uses este formulario**: sigue SECURITY.md.
  - type: textarea
    id: que-paso
    attributes: { label: Qué pasó, description: "Qué hiciste, qué esperabas y qué ocurrió." }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Versión o commit, placeholder: v1.7.0 }
  - type: dropdown
    id: formato
    attributes:
      label: Formato del archivo
      options: [Excel, CSV/TSV, JSON/NDJSON, Syslog/texto, Correo .eml, No aplica]
  - type: dropdown
    id: ia
    attributes:
      label: Proveedor de IA (si aplica)
      options: [Ninguno (reglas), Claude, Ollama]
  - type: textarea
    id: extra
    attributes: { label: Archivo de prueba o salida del registro, description: "Solo datos sintéticos. Pega aquí el error de la consola o del servidor si lo hay." }
