name: Falso positivo o detección omitida
description: Una regla marca actividad normal, o no detecta un ataque
labels: [deteccion]
body:
  - type: markdown
    attributes:
      value: Usa datos sintéticos (IP de documentación, usuarios ficticios). Nada de logs reales de un cliente.
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo
      options: [Falso positivo (marca algo legítimo), Detección omitida (no marca un ataque)]
    validations: { required: true }
  - type: input
    id: regla
    attributes: { label: Regla o hallazgo, placeholder: "p. ej. persistence, g_auth, INC-005" }
  - type: textarea
    id: eventos
    attributes: { label: Eventos mínimos que lo reproducen, description: "Unas pocas filas (CSV o JSON) con los campos relevantes." }
    validations: { required: true }
  - type: textarea
    id: esperado
    attributes: { label: Qué debería pasar y por qué }
    validations: { required: true }
