name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can only read the repository
permissions:
  contents: read

jobs:
  tests:
    name: Tests y cobertura
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Instalar dependencias (versiones exactas con hash)
        run: pip install --require-hashes -r requirements-dev.lock
      - name: Pruebas con cobertura mínima
        run: python -m pytest --cov=backend --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Subir cobertura a Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  security:
    name: Seguridad (bandit + pip-audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      - name: Análisis estático del código
        run: bandit -q -r backend
      - name: Vulnerabilidades conocidas en dependencias
        run: pip-audit -r requirements.lock --require-hashes --disable-pip

  docker:
    name: Imagen Docker (build + Trivy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t soc-incident-analyzer:ci .
      # Trivy se ejecuta como contenedor (mismo origen que la imagen base) en lugar de instalar el binario
      # con la action, cuya descarga falla en los runners (exit code 6). Versión fija; el volumen
      # reutiliza la base de datos de vulnerabilidades entre los dos pasos.
      - name: Informe de vulnerabilidades (HIGH y CRITICAL, solo informativo)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache \
            aquasec/trivy:0.69.3 image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 0 soc-incident-analyzer:ci
      - name: Bloquear si hay vulnerabilidades CRITICAL con parche disponible
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache \
            aquasec/trivy:0.69.3 image --scanners vuln --severity CRITICAL \
            --ignore-unfixed --exit-code 1 soc-incident-analyzer:ci

  e2e:
    name: Pruebas de navegador (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      # Playwright solo se usa en este job y no está en los lock con hashes; versión fija
      - run: pip install playwright==1.63.0 && python -m playwright install --with-deps chromium
      - run: python -m pytest tests/e2e/test_ui.py
