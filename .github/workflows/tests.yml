name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can only read the repository
permissions:
  contents: read

jobs:
  tests:
    name: Tests y cobertura
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Instalar dependencias (versiones exactas con hash)
        run: pip install --require-hashes -r requirements-dev.lock
      - name: Pruebas con cobertura mínima
        run: python -m pytest --cov=backend --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Subir cobertura a Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  security:
    name: Seguridad (bandit + pip-audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      - name: Análisis estático del código
        run: bandit -q -r backend
      - name: Vulnerabilidades conocidas en dependencias
        run: pip-audit -r requirements.lock --require-hashes --disable-pip

  exactitud:
    name: Exactitud (OTRF + SSH real)
    runs-on: ubuntu-24.04
    # Los datos de prueba se fijan a un commit concreto: si las fuentes cambian, la medición no se mueve sola.
    env:
      OTRF_COMMIT: d9d40ef123d2c87d5d3df28c96bcab4f0faccc87
      LOGHUB_COMMIT: dd61d0952749ee7963bde24220d1be5ede023033
      LOGHUB_SHA256: 1e4912727fa88245113d41b16a0cd25ceadba7f931e1c406542885b91254264f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      - name: Descargar los ataques etiquetados de OTRF (107 datasets de Windows)
        run: |
          git init -q "$RUNNER_TEMP/otrf"
          cd "$RUNNER_TEMP/otrf"
          git remote add origin https://github.com/OTRF/Security-Datasets
          git sparse-checkout set --no-cone 'datasets/atomic/_metadata/*' 'datasets/atomic/windows/*/host/*'
          git fetch -q --depth 1 --filter=blob:none origin "$OTRF_COMMIT"
          git checkout -q FETCH_HEAD
      - name: Descargar el log de SSH real (Loghub) y comprobar su huella
        run: |
          curl -fsSL -o "$RUNNER_TEMP/OpenSSH_2k.log" "https://raw.githubusercontent.com/logpai/loghub/$LOGHUB_COMMIT/OpenSSH/OpenSSH_2k.log"
          echo "$LOGHUB_SHA256  $RUNNER_TEMP/OpenSSH_2k.log" | sha256sum -c -
      # Falla si un dataset deja de detectar la técnica o la táctica, si alguno da error o si SSH pierde una IP o suma un falso positivo.
      # La tabla completa (mejoras y cambios para revisar) queda en el resumen de esta ejecución.
      - name: Comparar con la línea base
        run: python scripts/validar_datasets.py "$RUNNER_TEMP/otrf" --loghub "$RUNNER_TEMP/OpenSSH_2k.log" --base tests/validation/linea_base.json --resumen-md "$GITHUB_STEP_SUMMARY"

  docker:
    name: Imagen Docker (build + Trivy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Construir la imagen
        run: docker build -t soc-incident-analyzer:ci .
      # Trivy se ejecuta como contenedor (mismo origen que la imagen base) en lugar de instalar el binario
      # con la action, cuya descarga falla en los runners (exit code 6). Versión fija; el volumen
      # reutiliza la base de datos de vulnerabilidades entre los dos pasos.
      - name: Informe de vulnerabilidades (HIGH y CRITICAL, solo informativo)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache \
            aquasec/trivy:0.69.3 image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 0 soc-incident-analyzer:ci
      - name: Bloquear si hay vulnerabilidades CRITICAL con parche disponible
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache \
            aquasec/trivy:0.69.3 image --scanners vuln --severity CRITICAL \
            --ignore-unfixed --exit-code 1 soc-incident-analyzer:ci

  e2e:
    name: Pruebas de navegador (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      # Playwright solo se usa en este job y no está en los lock con hashes; versión fija
      - run: pip install playwright==1.63.0 && python -m playwright install --with-deps chromium
      - run: python -m pytest tests/e2e/test_ui.py

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Construir la imagen
        run: docker build -t soc-incident-analyzer:ci .
      # Mismo Trivy fijado que en el job de la imagen: lista los componentes (Python y sistema) en formato CycloneDX.
      - name: Generar el SBOM de la imagen
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache \
            -v "$PWD:/out" \
            aquasec/trivy:0.69.3 image --format cyclonedx --output /out/sbom.cdx.json soc-incident-analyzer:ci
      - name: Comprobar que el SBOM tiene componentes
        run: python -c "import json,sys; d=json.load(open('sbom.cdx.json')); n=len(d.get('components',[])); print(n,'componentes'); sys.exit(0 if n>20 else 1)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
