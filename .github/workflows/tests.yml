name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can only read the repository
permissions:
  contents: read

jobs:
  tests:
    name: Tests y cobertura
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Instalar dependencias (versiones exactas con hash)
        run: pip install --require-hashes -r requirements-dev.lock
      - name: Pruebas con cobertura mínima
        run: python -m pytest --cov=backend --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - name: Subir cobertura a Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
