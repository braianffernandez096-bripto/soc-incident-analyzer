   name: Tests

   on:
     push:
       branches: [main]
     pull_request:

   jobs:
     pytest:
       runs-on: ubuntu-24.04
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-python@v5
           with:
             python-version: "3.12"
             cache: pip
         - run: pip install -r requirements.txt
         - run: python -m pytest --cov=backend --cov-report=term-missing

     docker:
       runs-on: ubuntu-24.04
       steps:
         - uses: actions/checkout@v4
         - run: docker build -t soc-incident-analyzer .
