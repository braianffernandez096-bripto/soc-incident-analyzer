services:
  analyzer:
    build: .
    image: soc-incident-analyzer
    user: "10001:10001"
    ports:
      # Only reachable from this computer. Without APP_ACCESS_TOKEN the app has no login.
      - "127.0.0.1:8000:8000"
    environment:
      # All optional: taken from your shell or from a .env file next to this file
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - VT_API_KEY=${VT_API_KEY:-}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - APP_ACCESS_TOKEN=${APP_ACCESS_TOKEN:-}
      # Nombres con los que se puede abrir la app además de 127.0.0.1 y localhost (protege de DNS rebinding); ver SECURITY.md
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      # IP del proxy inverso del que se acepta X-Forwarded-For. Vacío = de ninguno (lo correcto sin proxy)
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-}
      - DNS_LOOKUPS=${DNS_LOOKUPS:-}
      - CAPTCHA=${CAPTCHA:-}
      - CAPTCHA_TYPE=${CAPTCHA_TYPE:-}
      - ENABLE_DOCS=${ENABLE_DOCS:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Wazuh en vivo y Telegram (opcionales, apagados por defecto; ver docs/WAZUH.md)
      - WAZUH_INGEST=${WAZUH_INGEST:-}
      - WAZUH_INGEST_TOKEN=${WAZUH_INGEST_TOKEN:-}
      - WAZUH_ANALYZE_SECONDS=${WAZUH_ANALYZE_SECONDS:-}
      - WAZUH_WINDOW_HOURS=${WAZUH_WINDOW_HOURS:-}
      - WAZUH_MAX_ROWS=${WAZUH_MAX_ROWS:-}
      - WAZUH_DIGEST_MINUTES=${WAZUH_DIGEST_MINUTES:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_INCLUDE_HOST=${TELEGRAM_INCLUDE_HOST:-}
      - TELEGRAM_DETAIL=${TELEGRAM_DETAIL:-}
      - APP_BASE_URL=${APP_BASE_URL:-}
      # Contexto opcional: CISA KEV + EPSS (se descargan y se cruzan en local) y tu MISP (ver docs/CONTEXTO.md)
      - CONTEXT_ENABLED=${CONTEXT_ENABLED:-}
      - CONTEXT_DIR=${CONTEXT_DIR:-/tmp/context}
      - CONTEXT_REFRESH_HOURS=${CONTEXT_REFRESH_HOURS:-}
      - MISP_URL=${MISP_URL:-}
      - MISP_KEY=${MISP_KEY:-}
      - MISP_VERIFY=${MISP_VERIFY:-}
      - MISP_ONLY_IDS=${MISP_ONLY_IDS:-}
      - MISP_INCLUDE_PRIVATE=${MISP_INCLUDE_PRIVATE:-}
      - MISP_CACHE_SECONDS=${MISP_CACHE_SECONDS:-}
      # Feed JSON propio de indicadores (con vencimiento) y contexto desde el Indexer de Wazuh (ver docs/FEED.md y docs/WAZUH.md)
      - FEED_PATH=${FEED_PATH:-}
      - FEED_URL=${FEED_URL:-}
      - FEED_TTL_DAYS=${FEED_TTL_DAYS:-}
      - FEED_REFRESH_HOURS=${FEED_REFRESH_HOURS:-}
      - WAZUH_INDEXER_URL=${WAZUH_INDEXER_URL:-}
      - WAZUH_INDEXER_USER=${WAZUH_INDEXER_USER:-}
      - WAZUH_INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD:-}
      - WAZUH_INDEXER_VERIFY=${WAZUH_INDEXER_VERIFY:-}
      - WAZUH_INDEXER_WINDOW_MIN=${WAZUH_INDEXER_WINDOW_MIN:-}
      - WAZUH_INDEXER_MAX=${WAZUH_INDEXER_MAX:-}
      - WAZUH_INDEXER_ARCHIVES=${WAZUH_INDEXER_ARCHIVES:-}
      - WAZUH_INDEXER_RAW_WINDOW_SEC=${WAZUH_INDEXER_RAW_WINDOW_SEC:-}
      - WAZUH_INDEXER_RAW_MAX=${WAZUH_INDEXER_RAW_MAX:-}
    # Lets the container reach an Ollama running on this computer (OLLAMA_HOST=http://host.docker.internal:11434)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./feed:/feed:ro        # carpeta para tu feed JSON de indicadores (FEED_PATH=/feed/indicadores.json); solo lectura
    # Least privilege: read-only filesystem (uploads are spooled to a small tmpfs), no capabilities, no escalation
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 200
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
