<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOC Incident Analyzer</title>
  <meta name="description" content="Analiza el export de un SIEM, detecta indicadores de compromiso, agrupa incidentes y genera el informe técnico en PDF.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e1b2e'/%3E%3Cpath d='M7 20h5l3-9 4 13 3-8h3' fill='none' stroke='%23ff6a2b' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="theme-init.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <div class="top-row">
        <a class="brand" href="#/" aria-label="SOC Incident Analyzer, inicio">
          <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#ff6a2b"/><path d="M7 20h5l3-9 4 13 3-8h3" fill="none" stroke="#0e1b2e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span><strong>SOC Incident Analyzer</strong><small id="brandSub">Investigación de incidentes</small></span>
        </a>
        <div class="tools">
          <button class="tool wide" id="searchBtn" aria-label="Buscar casos, hallazgos e indicadores (Ctrl+K)">
            <svg width="15" height="15" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span>Buscar incidente, hallazgo o IoC</span><kbd>Ctrl K</kbd>
          </button>
          <button class="tool" id="helpBtn" aria-label="¿Cómo funciona?"><span class="ico" aria-hidden="true">?</span><span class="lbl">¿Cómo funciona?</span></button>
          <div class="menu-wrap">
            <button class="tool" id="settingsBtn" aria-haspopup="true" aria-expanded="false" aria-controls="settingsMenu" aria-label="Ajustes de visualización">
              <svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h8M15 5h2M3 10h2M9 10h8M3 15h10M17 15h0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="13" cy="5" r="2" fill="currentColor"/><circle cx="7" cy="10" r="2" fill="currentColor"/><circle cx="15" cy="15" r="2" fill="currentColor"/></svg>
              <span class="lbl">Ajustes</span>
            </button>
            <div class="menu" id="settingsMenu" role="menu" aria-label="Ajustes de visualización" hidden>
              <button role="menuitem" id="themeBtn"></button>
              <button role="menuitem" id="motionBtn"></button>
            </div>
          </div>
        </div>
      </div>
      <div class="tabs-row">
        <nav id="nav" class="tabs" aria-label="Secciones"></nav>
        <div class="rail-foot" id="railFoot"></div>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="busy" class="busy" hidden><div class="busy-box"><div class="spin" aria-hidden="true"></div><p id="busyText">Procesando…</p></div></div>
  <script src="vendor/anime.min.js"></script>
  <script src="app.js"></script>
  <script src="bg.js"></script>
</body>
</html>
